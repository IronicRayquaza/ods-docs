name: Build and deploy

# Runs every night, on every push to main, and by hand from the Actions tab.
# Builds the site from the latest Osmantic/ODS and publishes it to GitHub Pages.
# If the tests or the build fail (say a recipe points at a doc ODS renamed),
# nothing is published and the live site keeps its last good version.
on:
  push:
    branches: [main]
  schedule:
    - cron: '23 3 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run the tests
        run: npm test

      - name: Get the latest ODS
        run: git clone --depth 1 https://github.com/Osmantic/ODS "$RUNNER_TEMP/ods-source"

      - name: Build the site
        run: node build.js "$RUNNER_TEMP/ods-source" _site

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
